<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What to do before the data catches up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --g:#faf9f7;--ink:#16150f;--ink2:#55524a;--ink3:#817d72;--rule:#e3e0d8;--rs:#c9c5ba;
  --card:#fff;--tick:#1baf7a;--accent:#eb6834;--chip:#f1efe9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --g:#1a1a19;--ink:#f5f4ef;--ink2:#c3c2b7;--ink3:#8f8e84;--rule:#35352f;--rs:#4b4b43;
  --card:#212120;--tick:#199e70;--accent:#e0763c;--chip:#2a2a26;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--ink);font-family:var(--sans);
  padding:18px 16px 14px;-webkit-text-size-adjust:100%}

h1{font-size:15px;font-weight:600;margin:0 0 12px;line-height:1.3}

/* Each audience counts separately: nobody is both a student and already working,
   so a single combined tally over all six was a category error. */
.tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.tabs button{font-family:var(--sans);font-size:12px;line-height:1;padding:7px 12px;
  border-radius:999px;border:1px solid var(--rule);background:var(--chip);color:var(--ink2);
  cursor:pointer;transition:background .13s,color .13s,border-color .13s}
.tabs button:hover{border-color:var(--rs)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--g);border-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs .count{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.tabs .count b{color:var(--ink);font-weight:500}

.meter{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 0 14px}
.meter i{display:block;height:100%;width:0;background:var(--tick);transition:width .22s ease}

ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
[role="tabpanel"][hidden]{display:none}

li label{display:grid;grid-template-columns:22px 1fr;gap:0 10px;align-items:start;
  background:var(--card);border:1px solid var(--rule);border-radius:7px;
  padding:11px 13px;cursor:pointer;transition:border-color .15s,opacity .15s}
li label:hover{border-color:var(--rs)}
li input{appearance:none;-webkit-appearance:none;margin:1px 0 0;width:17px;height:17px;
  border:1.5px solid var(--rs);border-radius:4px;background:var(--card);cursor:pointer;
  display:grid;place-content:center;transition:background .15s,border-color .15s}
li input:checked{background:var(--tick);border-color:var(--tick)}
li input::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(1px,-1px);opacity:0;transition:opacity .15s}
li input:checked::after{opacity:1}
li input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.txt{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.txt b{color:var(--ink);font-weight:600}
li label:has(input:checked){opacity:.55}
li label:has(input:checked) .txt b{text-decoration:line-through;text-decoration-thickness:1px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin:14px 0 0;padding-top:9px;border-top:1px dotted var(--rule)}
.note{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink3);line-height:1.6}
button.reset{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  background:none;border:0;padding:0;color:var(--ink3);cursor:pointer;
  border-bottom:1px solid var(--rule)}
button.reset:hover{color:var(--ink);border-bottom-color:var(--ink)}

@media(max-width:560px){
  body{padding:15px 13px 12px}
  h1{font-size:17px}
  .tabs button{font-size:14px;padding:0 16px;min-height:44px}
  .tabs .count{margin-left:0;width:100%;order:3;font-size:11px}
  .txt{font-size:15px;line-height:1.5}
  li label{padding:13px 13px;grid-template-columns:28px 1fr;gap:0 11px}
  li input{width:24px;height:24px}
  li input::after{width:12px;height:7px;border-left-width:2.5px;border-bottom-width:2.5px}
  button.reset{font-size:11px;padding:11px 0;min-height:44px}
  .note{font-size:10px}
}
</style>

<h1 id="h" hidden>What to do before the data catches up</h1>

<div class="tabs" role="tablist" aria-label="Who you are">
  <button role="tab" id="t0" aria-controls="p0" aria-selected="true">Professionals</button>
  <button role="tab" id="t1" aria-controls="p1" aria-selected="false" tabindex="-1">Students</button>
  <span class="count" id="count"></span>
</div>
<div class="meter"><i id="meter"></i></div>

<div id="panels"></div>

<div class="foot">
  <span class="note">Ticks are saved in this browser only</span>
  <button class="reset" type="button" id="reset">Clear this list</button>
</div>

<script>
const TABS = [
  {name: "Professionals", items: [
    ["Move up a layer before yours moves.",
     "List the operational parts of your job, because that's what goes first. Put your hours into the parts where you specify, evaluate and decide."],
    ["Read the specs, not job titles.",
     "The official categories are frozen until 2028. Postings show the new shape now, and 63% of US AI-titled postings are already outside tech."],
    ["Rebuild the rung.",
     "Your juniors learned on the work you're automating. Give them the evals to write and the AI output to review, with a senior checking their calls."]
  ]},
  {name: "Students", items: [
    ["Learn to verify the machine output.",
     "In medicine that's validating a generated note; in law, sampling a model's document review; in software, writing the eval. Get reps at it before anyone pays you to."],
    ["Pair your subject with the computational layer inside it.",
     "Anthropic's interpretability team hires astronomers, physicists, mathematicians and biologists. Be the person in your field who can test what the model does."],
    ["Practise judgment where mistakes are cheap.",
     "Law firms are training new associates on simulated cases so they can fail safely. Find the equivalent in your field: projects where you make the call and someone senior checks it."]
  ]}
];

const KEY = "roles-checklist-v2";

// localStorage can be unavailable or throw (private windows, blocked site data),
// so the list has to work without it.
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch (e) { return {}; }
}
function save(s) {
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
}

let state = load();
let active = 0;
const boxesByTab = [[], []];

const panels = document.getElementById("panels");
TABS.forEach(function (t, ti) {
  const panel = document.createElement("div");
  panel.id = "p" + ti;
  panel.setAttribute("role", "tabpanel");
  panel.setAttribute("aria-labelledby", "t" + ti);
  if (ti !== 0) panel.hidden = true;

  const ul = document.createElement("ul");
  t.items.forEach(function (it, ii) {
    const id = "t" + ti + "-" + ii;

    const li = document.createElement("li");
    const label = document.createElement("label");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = id;
    box.checked = !!state[id];
    box.addEventListener("change", function () {
      state[id] = box.checked;
      save(state);
      tally();
    });
    boxesByTab[ti].push(box);

    const txt = document.createElement("span");
    txt.className = "txt";
    const lead = document.createElement("b");
    lead.textContent = it[0] + " ";
    txt.appendChild(lead);
    txt.appendChild(document.createTextNode(it[1]));

    label.appendChild(box);
    label.appendChild(txt);
    li.appendChild(label);
    ul.appendChild(li);
  });
  panel.appendChild(ul);
  panels.appendChild(panel);
});

function tally() {
  const boxes = boxesByTab[active];
  const done = boxes.filter(function (b) { return b.checked; }).length;
  document.getElementById("count").innerHTML = "<b>" + done + "</b> of " + boxes.length + " done";
  document.getElementById("meter").style.width = (done / boxes.length * 100) + "%";
}

const tabEls = [document.getElementById("t0"), document.getElementById("t1")];

function select(i) {
  active = i;
  tabEls.forEach(function (el, j) {
    el.setAttribute("aria-selected", String(j === i));
    el.tabIndex = j === i ? 0 : -1;
    document.getElementById("p" + j).hidden = j !== i;
  });
  tally();
}

tabEls.forEach(function (el, i) {
  el.addEventListener("click", function () { select(i); });
  el.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    const step = e.key === "ArrowRight" ? 1 : -1;
    const next = (i + step + tabEls.length) % tabEls.length;
    select(next);
    tabEls[next].focus();
  });
});

document.getElementById("reset").addEventListener("click", function () {
  boxesByTab[active].forEach(function (b) { b.checked = false; state[b.id] = false; });
  save(state);
  tally();
});

// the section heading above already names this panel, so show the title
// only when the page is opened on its own
if (window.self === window.top) {
  const h = document.getElementById("h");
  if (h) h.hidden = false;
}

select(0);
</script>
